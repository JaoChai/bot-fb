# BotJao — auth + chat data contract (OpenAPI 3.1)
#
# Written description of TODAY'S backend behavior for the operations
# `login`, `listConversations`, `listConversationMessages` and the
# MessageSent / ConversationUpdated broadcasts. It is deliberately
# server-shaped, not aspirational: if the backend changes an observable
# shape, this file and tests/Feature/Contracts/AuthChatContractTest.php
# must change in the same review.
#
# Fixed by plan #3 (2026-10-25): login stays flat {user, token}; lists keep
# {data, meta} page-based pagination; the message list is offset/page
# pagination (the cursor comment in useMessageQueries.ts is stale and stays);
# errors keep the legacy {message, errors} style (no RFC 9457 conversion).
openapi: 3.1.0
info:
  title: BotJao Auth + Chat contract
  version: 1.0.0
  description: |
    Scoped contract for the login + chat slice. Each response body is a named
    schema under components/schemas so tests can validate real payloads
    against one component. `x-broadcast` maps each Laravel event class to the
    private channel it broadcasts on and the event name clients subscribe to.
servers:
  - url: https://api.botjao.com
  - url: http://localhost:8000
tags:
  - name: Auth
  - name: Chat
  - name: Settings

x-broadcast:
  MessageSent:
    event: message.sent
    channel: private-bot.{bot_id}
    authorization: Bot owner only — Broadcast::channel('bot.{botId}') returns bot.user_id === user.id (routes/channels.php).
    payload: MessageSentPayload
  ConversationUpdated:
    event: conversation.{update_type}
    channel: private-bot.{bot_id}
    authorization: Bot owner only — Broadcast::channel('bot.{botId}') returns bot.user_id === user.id (routes/channels.php).
    payload: ConversationUpdatedPayload
    update_type values: [updated, created, message_received]

paths:
  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with email + password, receive a flat {message, user, token, token_type} envelope.
      description: |
        Public, behind the strict `auth` rate limiter: 5 attempts per minute
        keyed by `email|IP`. Tokens are Sanctum personal access tokens valid
        for 30 days. `revoke_previous` deletes all of the user's existing
        tokens before minting the new one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_name:
                  type: [string, "null"]
                  maxLength: 255
                  description: Token name shown in /auth/tokens; defaults to "auth-token".
                revoke_previous:
                  type: [boolean, "null"]
                  default: false
      responses:
        "200":
          description: Logged in. Flat envelope — never wrapped in `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          description: |
            Validation failed (unknown email, bad email format, missing
            password, wrong password). An unknown email is answered with the
            same {message, errors.email} shape — this operation has no 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: More than 5 login attempts per minute for this email|IP.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt is allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"

  /api/bots/{bot}/conversations:
    get:
      operationId: listConversations
      tags: [Chat]
      summary: Paginated conversation list for one bot, plus status counters in meta.
      description: |
        Sanctum bearer auth + BotPolicy::view (bot owner, or admin assigned to
        the bot). Default filter excludes `closed` conversations unless
        `status` is passed. Page-based pagination (default per_page 20).
        `meta.status_counts` covers all conversations of the bot regardless of
        the current page/filter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BotId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          description: Comma-separated or repeated; defaults to "active,handover".
          schema:
            type: string
            example: active,handover
        - name: channel_type
          in: query
          schema:
            type: string
            enum: [line, facebook, telegram, demo]
        - name: telegram_chat_type
          in: query
          schema:
            type: string
        - name: is_handover
          in: query
          schema:
            type: boolean
        - name: assigned_user_id
          in: query
          schema:
            type: integer
        - name: tags
          in: query
          description: Comma-separated tag names, each matched via JSON contains.
          schema:
            type: string
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          description: Matches external customer id, or profile name/email/phone via full-text.
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [last_message_at, created_at, message_count, status]
            default: last_message_at
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Conversation page with pagination links/meta and status counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          description: Missing/expired Sanctum token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: Authenticated user cannot view this bot (not owner, not assigned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "429":
          description: API rate limit exceeded (300 requests per minute).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"

  /api/bots/{bot}/conversations/{conversation}/messages:
    get:
      operationId: listConversationMessages
      tags: [Chat]
      summary: Paginated messages of one conversation (offset/page, NOT cursor).
      description: |
        Sanctum bearer auth, BotPolicy::view, and the conversation must belong
        to the bot (otherwise 404). Offset/page pagination: `per_page` is
        capped server-side at 100 (default 50), `order` defaults to `desc`
        (newest first). This is the shape the message hook paginates with.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BotId"
        - $ref: "#/components/parameters/ConversationId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Capped at 100 server-side.
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Message page with pagination links/meta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "401":
          description: Missing/expired Sanctum token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: Authenticated user cannot view this bot — no data in the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: Conversation does not belong to the bot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "429":
          description: API rate limit exceeded (300 requests per minute).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitError"

  /bots/{bot}/settings:
    get:
      operationId: getBotSettings
      tags: [Settings]
      summary: One bot's settings; every response carries the four follow-up keys.
      description: |
        Sanctum bearer auth + BotPolicy::view (bot owner, or admin assigned to
        the bot). The response `data` has the same key set on every response —
        for a bot with no settings row yet the row is created first, with
        follow_up_enabled false, follow_up_mode "approve", follow_up_started_at
        null and the capability object of the fresh bot.

        The four follow-up keys: `follow_up_enabled` (JSON boolean),
        `follow_up_mode` ("approve" or "automatic"), `follow_up_started_at`
        (null, or an ISO 8601 instant equal to the stored Bangkok wall time —
        stored "2026-11-16 10:00:00" is the instant "2026-11-16T03:00:00Z")
        and `follow_up_capabilities` (FollowUpCapabilities::forBot, unchanged).
        The internal columns `follow_up_activation_message_id` and
        `follow_up_activated_at` are absent from every response.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BotId"
      responses:
        "200":
          description: The settings row (created on first call when missing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBotSettingsResponse"
        "401":
          description: No or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: Authenticated user that is neither the owner nor an assigned admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: Unknown bot id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    put:
      operationId: updateBotSettings
      tags: [Settings]
      summary: Save settings; the follow-up switch with its capability gate and snapshot.
      description: |
        Sanctum bearer auth + BotPolicy::update (bot owner only). Full save —
        the settings page sends ~30 named fields with none of them a follow-up
        key; a request without follow-up keys behaves exactly as before.

        `follow_up_enabled` accepts JSON true/false only (1, 0, "1", "true",
        "false", null and lists are 422). false -> true is refused with 422 and
        errors.follow_up_enabled[0] set to the blocked_reason code when
        capabilities.supported is false. When allowed, the snapshot
        (follow_up_started_at = follow_up_activated_at = the Bangkok wall time
        of the request, follow_up_activation_message_id = max(messages.id)
        read in the same transaction) is written once, guarded by "started_at
        is null" — it never moves on later off/on cycles. true -> true is a
        no-op with no capability check (the page sends the key on every save).
        true -> false is always allowed and resets follow_up_mode to approve.
        Any refusal writes nothing, other fields included; a refused request on
        a bot with no settings row leaves bot_settings without a row.

        `follow_up_mode` ("approve" | "automatic") accepts automatic only when
        the switch is on and capabilities.automatic_allowed is true (both
        evaluated with this same request applied); a stored automatic repeated
        is a no-op. The internal snapshot keys and follow_up_capabilities are
        refused with 422 in body or query, null included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBotSettingsRequest"
      responses:
        "200":
          description: Saved; `data` mirrors the GET body shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBotSettingsResponse"
        "401":
          description: No or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: Non-owner (assigned admins may read, only the owner may save).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: Unknown bot id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: |
            A refused follow-up change, a bad value shape (strict JSON boolean
            for follow_up_enabled; approve/automatic for follow_up_mode), an
            internal key present, or any pre-existing field validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
    patch:
      operationId: patchBotSettings
      tags: [Settings]
      summary: Partial save — same contract as PUT.
      description: |
        Sanctum bearer auth + BotPolicy::update (bot owner only). Identical
        follow-up semantics to PUT; fields not sent keep their stored values.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBotSettingsRequest"
      responses:
        "200":
          description: Saved; `data` mirrors the GET body shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBotSettingsResponse"
        "401":
          description: No or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: Non-owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: Unknown bot id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: Same validation and refusal rules as PUT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token (issued by `login`).

  parameters:
    BotId:
      name: bot
      in: path
      required: true
      schema:
        type: integer
    ConversationId:
      name: conversation
      in: path
      required: true
      schema:
        type: integer

  schemas:
    # ---------- login ----------
    LoginUser:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - email_verified_at
        - created_at
        - updated_at
        - subscription_plan
        - subscription_expires_at
        - timezone
        - role
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        subscription_plan:
          type: string
        subscription_expires_at:
          type: [string, "null"]
          format: date-time
        timezone:
          type: string
          default: Asia/Bangkok
        role:
          type: string
          enum: [owner, admin]

    LoginResponse:
      type: object
      additionalProperties: false
      required: [message, user, token, token_type]
      properties:
        message:
          type: string
          const: Login successful
        user:
          $ref: "#/components/schemas/LoginUser"
        token:
          type: string
          description: Sanctum plain-text token; store it, it is not retrievable later.
        token_type:
          type: string
          const: Bearer

    # ---------- chat resources ----------
    Conversation:
      type: object
      additionalProperties: false
      required:
        - id
        - bot_id
        - customer_profile_id
        - external_customer_id
        - channel_type
        - status
        - is_handover
        - assigned_user_id
        - memory_notes
        - tags
        - context
        - current_flow_id
        - message_count
        - unread_count
        - last_message_at
        - bot_auto_enable_at
        - bot_auto_enable_remaining_seconds
        - context_cleared_at
        - created_at
        - updated_at
        - customer_profile
        - assigned_user
        - last_message
        - needs_response
      properties:
        id:
          type: integer
        bot_id:
          type: integer
        customer_profile_id:
          type: [integer, "null"]
        external_customer_id:
          type: string
        channel_type:
          type: string
          enum: [line, facebook, telegram, demo]
        status:
          type: string
          enum: [active, closed, handover]
        is_handover:
          type: boolean
        assigned_user_id:
          type: [integer, "null"]
        memory_notes:
          description: AI-generated memory; JSON column, decoded array or null.
          type: [array, "null"]
        tags:
          type: array
          items:
            type: string
        context:
          description: Free-form JSON column (array or object) or null.
          type: [array, object, "null"]
        current_flow_id:
          type: [integer, "null"]
        message_count:
          type: integer
        unread_count:
          type: integer
        last_message_at:
          type: [string, "null"]
          format: date-time
        bot_auto_enable_at:
          type: [string, "null"]
          format: date-time
        bot_auto_enable_remaining_seconds:
          description: Seconds left before the bot auto-resumes; null while no timer or timer elapsed.
          type: [integer, "null"]
        context_cleared_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        customer_profile:
          description: >
            Loaded CustomerProfileResource when the conversation has a profile,
            null otherwise. Full shape owned by CustomerProfileResource —
            enumerated when that resource joins this contract.
          type: [object, "null"]
        assigned_user:
          description: Loaded UserResource when assigned; null otherwise.
          type: [object, "null"]
        last_message:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        needs_response:
          description: True when the latest message is from the customer (or there are no messages).
          type: boolean

    Message:
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_id
        - sender
        - content
        - type
        - media_url
        - media_type
        - media_metadata
        - model_used
        - prompt_tokens
        - completion_tokens
        - cost
        - external_message_id
        - reply_to_message_id
        - sentiment
        - intents
        - cached_tokens
        - reasoning_tokens
        - reasoning_content
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        sender:
          type: string
          enum: [user, bot, agent]
        content:
          type: string
        type:
          type: string
          enum: [text, image, file, sticker, location, audio, video, template, flex, postback]
        media_url:
          type: [string, "null"]
        media_type:
          type: [string, "null"]
        media_metadata:
          type: [object, array, "null"]
        model_used:
          type: [string, "null"]
        prompt_tokens:
          type: [integer, "null"]
        completion_tokens:
          type: [integer, "null"]
        cost:
          type: [number, "null"]
          description: USD cost, float with up to 6 decimals; null when the message used no billable model.
        external_message_id:
          type: [string, "null"]
        reply_to_message_id:
          type: [string, "null"]
        sentiment:
          type: [string, "null"]
        intents:
          type: [array, "null"]
        cached_tokens:
          type: [integer, "null"]
        reasoning_tokens:
          type: [integer, "null"]
        reasoning_content:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_outage_notice:
          description: >-
            True only for bot rows that are automated "recovered" notices sent
            after an outage. Surfaces the auto-reply badge without exposing raw
            metadata. Optional so old payloads (pre-rollout caches, optimistic
            messages) stay valid; treat absent as false (the safe default).
          type: boolean
        is_follow_up:
          description: >-
            True only for bot rows that are automated "customer follow-up"
            messages sent by the follow-up feature. Surfaces the follow-up
            badge without exposing raw metadata (follow_up_log_id never
            leaves the backend). Optional so old payloads (pre-rollout
            caches, optimistic messages) stay valid; treat absent as false
            (the safe default).
          type: boolean

    PaginationLinks:
      type: object
      additionalProperties: false
      required: [first, last, prev, next]
      properties:
        first:
          type: [string, "null"]
        last:
          type: [string, "null"]
        prev:
          type: [string, "null"]
        next:
          type: [string, "null"]

    PaginationMetaLink:
      type: object
      additionalProperties: false
      required: [url, label, page, active]
      properties:
        url:
          type: [string, "null"]
        label:
          type: string
        page:
          type: [integer, "null"]
        active:
          type: boolean

    StatusCounts:
      type: object
      additionalProperties: false
      required: [active, closed, handover, total, needs_response, waiting_customer]
      properties:
        active:
          type: integer
        closed:
          type: integer
        handover:
          type: integer
        total:
          type: integer
        needs_response:
          type: integer
        waiting_customer:
          type: integer

    ConversationListMeta:
      type: object
      additionalProperties: false
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
        - status_counts
      properties:
        current_page:
          type: integer
        from:
          type: [integer, "null"]
        last_page:
          type: integer
        links:
          type: array
          items:
            $ref: "#/components/schemas/PaginationMetaLink"
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, "null"]
        total:
          type: integer
        status_counts:
          $ref: "#/components/schemas/StatusCounts"

    MessageListMeta:
      type: object
      additionalProperties: false
      required: [current_page, from, last_page, links, path, per_page, to, total]
      properties:
        current_page:
          type: integer
        from:
          type: [integer, "null"]
        last_page:
          type: integer
        links:
          type: array
          items:
            $ref: "#/components/schemas/PaginationMetaLink"
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, "null"]
        total:
          type: integer

    ConversationListResponse:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/ConversationListMeta"

    MessageListResponse:
      type: object
      additionalProperties: false
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/MessageListMeta"

    # ---------- errors (legacy {message, errors} style — kept by decision) ----------
    UnauthorizedError:
      type: object
      additionalProperties: false
      required: [message, error]
      properties:
        message:
          type: string
          const: Unauthenticated.
        error:
          type: string
          const: Token expired or invalid. Please login again.

    ForbiddenError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: Laravel's default denial — "This action is unauthorized."

    NotFoundError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: '"Conversation not found" for a conversation outside the bot; otherwise Laravel''s default 404 message.'

    ValidationError:
      type: object
      additionalProperties: false
      required: [message, errors]
      properties:
        message:
          type: string
          description: Localized summary; may carry Laravel's "(and N more error)" suffix.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field name -> list of localized messages.

    RateLimitError:
      type: object
      additionalProperties: false
      required: [message, retry_after]
      properties:
        message:
          type: string
        retry_after:
          type: integer
          description: Seconds until the next attempt is allowed; mirrors the Retry-After header.

    # ---------- broadcast payloads ----------
    MessageSentConversationSnapshot:
      type: object
      additionalProperties: false
      required: [id, message_count, last_message_at, needs_response, unread_count]
      properties:
        id:
          type: integer
        message_count:
          type: integer
        last_message_at:
          type: [string, "null"]
          format: date-time
        needs_response:
          type: boolean
        unread_count:
          type: integer

    MessageSentPayload:
      description: |
        broadcastWith() of App\Events\MessageSent, event name `message.sent`,
        on private channel `bot.{bot_id}` (client channel: private-bot.{bot_id}).
        The conversation object is the snapshot captured at dispatch time, not
        a fresh read.
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_id
        - sender
        - content
        - type
        - media_url
        - media_type
        - created_at
        - conversation
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        sender:
          type: string
          enum: [user, bot, agent]
        content:
          type: string
        type:
          type: string
          enum: [text, image, file, sticker, location, audio, video, template, flex, postback]
        media_url:
          type: [string, "null"]
        media_type:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        is_outage_notice:
          description: >-
            True only for bot rows that are automated "recovered" notices sent
            after an outage. Optional so old payloads stay valid; treat absent
            as false (the safe default).
          type: boolean
        is_follow_up:
          description: >-
            True only for bot rows that are automated "customer follow-up"
            messages sent by the follow-up feature. Surfaces the follow-up
            badge without exposing raw metadata (follow_up_log_id never
            leaves the backend). Optional so old payloads stay valid; treat
            absent as false (the safe default).
          type: boolean
        conversation:
          $ref: "#/components/schemas/MessageSentConversationSnapshot"

    ConversationUpdatedPayload:
      description: |
        broadcastWith() of App\Events\ConversationUpdated, event name
        `conversation.{update_type}`, on private channel `bot.{bot_id}`.
      type: object
      additionalProperties: false
      required:
        - id
        - bot_id
        - status
        - is_handover
        - assigned_user_id
        - message_count
        - last_message_at
        - needs_response
        - unread_count
        - bot_auto_enable_at
        - update_type
        - updated_at
      properties:
        id:
          type: integer
        bot_id:
          type: integer
        status:
          type: string
          enum: [active, closed, handover]
        is_handover:
          type: boolean
        assigned_user_id:
          type: [integer, "null"]
        message_count:
          type: integer
        last_message_at:
          type: [string, "null"]
          format: date-time
        needs_response:
          type: boolean
        unread_count:
          type: integer
        bot_auto_enable_at:
          type: [string, "null"]
          format: date-time
        update_type:
          type: string
          enum: [updated, created, message_received]
          description: Dispatched values today — 'updated' (default), 'created', 'message_received'.
        updated_at:
          type: string
          format: date-time

    # ---------- customer follow-up switch (B5a) ----------
    CustomerFollowUpRules:
      type: object
      additionalProperties: false
      description: Numbers the follow-up feature runs on; no secrets (FollowUpCapabilities::forBot).
      required: [payment_wait_hours, sale_wait_hours, customer_gap_days, daily_draft_cap, approval_ttl_hours, send_start, send_end, timezone]
      properties:
        payment_wait_hours:
          type: integer
        sale_wait_hours:
          type: integer
        customer_gap_days:
          type: integer
        daily_draft_cap:
          type: integer
        approval_ttl_hours:
          type: integer
        send_start:
          type: string
        send_end:
          type: string
        timezone:
          type: string

    CustomerFollowUpCapabilities:
      type: object
      additionalProperties: false
      description: Bot-level readiness from FollowUpCapabilities::forBot — no token, chat id, user id or URL leaves it.
      required: [supported, telegram_ready, automatic_allowed, blocked_reason, rules]
      properties:
        supported:
          type: boolean
        telegram_ready:
          type: boolean
        automatic_allowed:
          type: boolean
        blocked_reason:
          type: [string, "null"]
          enum: [null, line_only, bot_not_in_pilot, telegram_missing, telegram_allowlist_missing, webhook_secret_missing, writer_missing, admin_url_missing]
        rules:
          $ref: "#/components/schemas/CustomerFollowUpRules"

    CustomerFollowUpSettingsFields:
      type: object
      additionalProperties: true
      description: |
        The four follow-up keys every settings response carries. Other settings
        fields of the row are allowed here without being listed.
      required: [follow_up_enabled, follow_up_mode, follow_up_started_at, follow_up_capabilities]
      properties:
        follow_up_enabled:
          type: boolean
        follow_up_mode:
          type: string
          enum: [approve, automatic]
        follow_up_started_at:
          type: [string, "null"]
          format: date-time
          description: ISO 8601 instant of the stored Bangkok wall time; null until the first successful enable.
        follow_up_capabilities:
          $ref: "#/components/schemas/CustomerFollowUpCapabilities"

    GetBotSettingsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CustomerFollowUpSettingsFields"

    UpdateBotSettingsRequest:
      type: object
      additionalProperties: true
      description: |
        Any subset of the savable settings fields; only the two follow-up keys
        are listed here. The internal snapshot keys and follow_up_capabilities
        are never valid anywhere in the request (body or query), null included.
      properties:
        follow_up_enabled:
          type: boolean
        follow_up_mode:
          type: string
          enum: [approve, automatic]

    UpdateBotSettingsResponse:
      type: object
      additionalProperties: false
      required: [message, data]
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/CustomerFollowUpSettingsFields"
