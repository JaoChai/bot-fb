name: security

# Layer-2 automatic security scan. Read-only: never deploys, needs no secret,
# does not modify any existing workflow.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version

      - name: Scan full git history for secrets
        # Exits non-zero when any leak is found (default gitleaks behavior).
        run: ./gitleaks git . --redact --verbose
